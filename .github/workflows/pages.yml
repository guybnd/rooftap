# Builds the landing page (apps/web/landing-static) and publishes it to this
# repo's GitHub Pages on every push to main. Needs Settings > Pages > Source
# set to "GitHub Actions" once. Set the repo variable SITE_URL if the site
# moves to a custom domain, and SIGN_IN_URL to show the Sign in buttons.
name: Landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:landing-static -w apps/web
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          VITE_SIGN_IN_URL: ${{ vars.SIGN_IN_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/landing-static/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
